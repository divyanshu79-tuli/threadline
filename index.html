<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Threadline — Meeting memory, in motion</title>
<style>
:root{--ink:#1e2928;--muted:#7e8986;--line:#e8ebe8;--paper:#fff;--wash:#f7f8f6;--green:#167d63;--mint:#e7f4ee;--amber:#aa6e17;--amberbg:#fff5e3;--red:#b55345;--redbg:#fff0ed;--blue:#52799d;--shadow:0 8px 28px #24352d0b}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font-family:'Segoe UI',sans-serif;font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:10px;padding:0 11px 12px;font:800 20px "Segoe UI",sans-serif;letter-spacing:-.8px}.logo{height:30px;width:30px;background:#d9eee4;border-radius:10px;display:grid;place-items:center;color:var(--green)}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:9px;color:#65716d;display:flex;align-items:center;gap:12px;font-weight:600}.nav button.active{background:#edf5f0;color:#176d58}.nav .icon{width:18px;text-align:center;font-size:16px}.navlabel{padding:17px 12px 7px;color:#a1aaa6;text-transform:uppercase;letter-spacing:1.2px;font-size:10px;font-weight:700}.side-bottom{margin-top:auto}.workspace{display:flex;gap:10px;margin:8px;padding:11px;border:1px solid var(--line);border-radius:11px;font-size:12px}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#dfece5;color:#3c725c;font-weight:700}.workspace small{display:block;color:var(--muted);margin-top:3px}.main{min-width:0}.topbar{height:73px;background:#ffffffbd;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 38px;position:sticky;top:0;z-index:4;backdrop-filter:blur(8px)}.crumb{font-size:13px;color:#84908a}.crumb b{color:var(--ink)}.top-right{display:flex;align-items:center;gap:14px}.sync{font-size:11px;color:#75817b;display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;background:#54a87e;border-radius:9px}.circlebtn{border:1px solid var(--line);background:white;width:35px;height:35px;border-radius:50%;color:#6b7773}.mainpad{max-width:1200px;margin:auto;padding:36px 42px 72px}.hello{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:27px}.eyebrow{color:var(--green);font-size:11px;text-transform:uppercase;letter-spacing:1.3px;font-weight:700;margin-bottom:10px}h1,h2,h3,p{margin-top:0}h1{font:700 30px "Segoe UI",sans-serif;letter-spacing:-1.15px;margin-bottom:7px}.sub{color:#84908b;font-size:13px}.button{border:1px solid #dfe5e0;border-radius:8px;padding:10px 14px;background:white;color:#46534e;font-size:12px;font-weight:700}.button:hover{background:#f6faf7}.primary{background:var(--green);border-color:var(--green);color:white}.primary:hover{background:#116a54}.button.small{padding:7px 10px;font-size:11px}.metricgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:22px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:11px;padding:17px 18px;box-shadow:var(--shadow)}.metric-top{display:flex;justify-content:space-between;color:#77827d;font-size:11px;font-weight:600}.metric-icon{color:#66947d}.metric-val{font:700 25px Manrope;margin:10px 0 3px;letter-spacing:-.7px}.metric-note{font-size:10px;color:#96a09b}.contentgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(285px,.8fr);gap:17px}.card{border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow)}.cardhead{padding:18px 19px 14px;display:flex;align-items:center;justify-content:space-between}.cardhead h2{font:700 14px Manrope;margin:0}.cardhead p{font-size:11px;color:#929c97;margin:5px 0 0}.list{padding:0 18px}.item{padding:15px 0;border-top:1px solid #eef0ed}.item:first-child{border-top:1px solid #f0f2ef}.item-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:5px;background:#edf5f0;color:#4d8069;font-size:9px;font-weight:700}.tag.conflict{background:var(--amberbg);color:var(--amber)}.tag.action{background:#eef2f8;color:#5a7896}.tag.memory{background:#f1eef9;color:#77649e}.time{font-size:10px;color:#9aa39f}.item h3{font-size:12px;margin:9px 0 6px;font-weight:700;line-height:1.45}.meta{color:#828d87;font-size:10px;display:flex;gap:12px;align-items:center}.person{display:inline-flex;align-items:center;gap:6px}.tinyavatar{width:19px;height:19px;border-radius:50%;background:#e7eee5;color:#5b795f;display:grid;place-items:center;font-size:9px;font-weight:700}.divider{margin:16px 0 8px;color:#96a19b;text-transform:uppercase;letter-spacing:1.15px;font-weight:700;font-size:9px}.warn{background:#fffaf1;border:1px solid #f3e4c8;border-radius:8px;padding:10px 11px;margin:10px 0;color:#866225;font-size:10px;line-height:1.55}.warn b{color:#805813}.row-actions{display:flex;gap:6px}.rightcol{display:grid;align-content:start;gap:16px}.digest{background:#f1f7f3;padding:16px;border-radius:9px;margin:0 18px 17px}.digestdate{font-size:10px;color:#648273;margin-bottom:7px}.digest h3{font:700 12px Manrope;margin:0 0 6px}.digest p{font-size:10px;color:#718179;line-height:1.55;margin:0}.personrow{padding:10px 0;border-top:1px solid #e2eae4;display:flex;justify-content:space-between;align-items:center;font-size:11px}.personrow:first-of-type{margin-top:12px}.count{font-size:10px;color:#73907f}.reminder{display:flex;gap:11px;padding:13px 0;border-top:1px solid #eef0ed}.reminder:first-child{border-top:0}.datebox{width:38px;height:40px;border-radius:8px;background:#fff3e7;color:#a56626;display:grid;place-items:center;text-align:center;font-size:9px;font-weight:700;line-height:1.2}.datebox b{font-size:14px}.reminder strong{font-size:11px;display:block;margin:2px 0 5px}.reminder small{color:#87928c;font-size:10px}.integration{margin:0 18px 17px;padding:11px;border:1px solid #eaedeb;border-radius:8px;display:flex;align-items:center;gap:10px}.integration-logo{width:30px;height:30px;border-radius:8px;background:#eee8fa;color:#765ca3;display:grid;place-items:center;font-weight:700}.integration strong{font-size:11px}.integration small{display:block;color:#929d97;font-size:9px;margin-top:4px}.bottomhint{margin:17px 0;background:#f2f5f3;border-radius:8px;padding:11px 12px;color:#718078;font-size:10px;line-height:1.55}.hide{display:none!important}.page-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:#98a19d;font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:11px;border-bottom:1px solid var(--line)}.table td{padding:14px 11px;border-bottom:1px solid #eff1ef;font-size:12px}.memsearch{padding:9px 12px;border:1px solid var(--line);border-radius:8px;min-width:235px}.empty{padding:48px;text-align:center;color:#86918c}.overlay{position:fixed;inset:0;background:#17241f68;z-index:8;display:grid;place-items:center;padding:20px}.modal{background:#fff;border-radius:14px;width:min(650px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 70px #0d211544;padding:24px}.modal h2{font:700 19px Manrope;margin:0 0 8px}.modal .muted{font-size:12px;color:#85918b;margin-bottom:17px}.field{display:block;font-size:11px;color:#596660;font-weight:700;margin:13px 0 6px}.input,.textarea,.select{width:100%;border:1px solid #dfe5e0;border-radius:7px;padding:10px 11px;color:#283430;outline:none}.textarea{resize:vertical;min-height:165px;line-height:1.55}.input:focus,.textarea:focus{border-color:#70a68f;box-shadow:0 0 0 3px #167d6314}.modalfoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.footright{display:flex;gap:8px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;background:#203a30;color:white;padding:12px 17px;border-radius:9px;box-shadow:0 7px 30px #0002;font-size:12px}.state{font-size:10px;color:#6c9c7f;font-weight:700}.toolbar{display:flex;align-items:center;gap:9px}.conflict-card{border:1px solid #f0dec0;background:#fffcf5;border-radius:8px;padding:12px;margin:11px 0}.conflict-card p{font-size:11px;line-height:1.5;margin:5px 0 0;color:#7d6c4b}.settingsgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pref{padding:17px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}.pref h3{font:700 13px Manrope;margin-bottom:6px}.pref p{color:#84908b;font-size:11px;line-height:1.5}.toggle{accent-color:var(--green)}.transcript{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:11px;color:#738079}.drop{border:1px dashed #cbd7cf;border-radius:8px;padding:11px;text-align:center;color:#8c9891;font-size:10px;margin-top:10px}.footnote{font-size:10px;color:#99a29d}
@media(max-width:1080px){.app{grid-template-columns:205px 1fr}.mainpad{padding:28px 24px}.contentgrid{grid-template-columns:1fr}.rightcol{grid-template-columns:1fr 1fr}.metricgrid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="logo">↗</div>threadline</div><div class="nav"><div class="navlabel">Workspace</div><button data-page="overview" class="active"><span class="icon">▦</span>Overview</button><button data-page="meetings"><span class="icon">◷</span>Meetings</button><button data-page="memory"><span class="icon">◉</span>Decision memory</button><div class="navlabel">Execution</div><button data-page="actions"><span class="icon">☑</span>Action items <span id="actionnav" style="margin-left:auto;color:#9aa49e"></span></button><button data-page="digest"><span class="icon">▤</span>Weekly digest</button><div class="navlabel">Workspace</div><button data-page="settings"><span class="icon">⚙</span>Settings</button></div><div class="side-bottom"><div class="workspace"><div class="avatar">N</div><div><b>Northstar Studio</b><small>Private workspace</small></div></div><div style="padding:12px;color:#9ba49f;font-size:10px">Local-first · Your data stays on this device</div></div></aside><main class="main"><header class="topbar"><div class="crumb">Workspace&nbsp; / &nbsp;<b id="crumb">Overview</b></div><div class="top-right"><div class="sync"><i class="dot"></i> Saved on this device</div><button class="circlebtn" onclick="toast('All caught up — nothing needs your attention.')">⌕</button><div class="avatar">N</div></div></header><div class="mainpad" id="view"></div></main></div><div id="layer"></div><script>
const seed={meetings:[{id:'m1',title:'Product & Engineering Weekly',date:'Oct 28, 2026',duration:'42 min',speakers:['Maya Chen','Leo Park','Sam Rivera'],transcript:'Maya Chen: We agreed to keep the beta invite-only until the onboarding completion rate reaches 70%.\nLeo Park: I will draft the onboarding checklist and share it with Maya by November 4.\nSam Rivera: We should push the public launch to November 20.\nMaya Chen: The API migration stays on the current November 12 deadline.\nLeo Park: I own the dashboard QA, and I will have it done by November 6.'}],memory:[{id:'d1',text:'Keep the beta invite-only until onboarding completion reaches 70%.',speaker:'Maya Chen',meeting:'Product & Engineering Weekly',date:'Oct 28, 2026',type:'Decision'},{id:'d2',text:'The API migration deadline is November 12.',speaker:'Maya Chen',meeting:'Product & Engineering Weekly',date:'Oct 28, 2026',type:'Decision'}],actions:[{id:'a1',text:'Draft onboarding checklist',owner:'Leo Park',due:'Nov 4, 2026',meeting:'Product & Engineering Weekly',status:'Needs review'},{id:'a2',text:'Complete dashboard QA',owner:'Leo Park',due:'Nov 6, 2026',meeting:'Product & Engineering Weekly',status:'Needs review'},{id:'a3',text:'Prepare launch readiness checklist',owner:'Maya Chen',due:'Nov 5, 2026',meeting:'Launch planning',status:'Approved'}],pending:[{id:'p1',text:'Move the public launch to November 20.',owner:'Sam Rivera',due:'Nov 20, 2026',meeting:'Product & Engineering Weekly',conflict:'Existing commitment: the public launch was scheduled for November 14.'}],integration:'Not connected',reminders:true,digest:true,reviewed:2};
let db=JSON.parse(localStorage.getItem('threadline-db')||'null')||seed;let page='overview';let trackerEndpoint='';const save=()=>localStorage.setItem('threadline-db',JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initials=s=>String(s||'?').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();const person=s=>`<span class="person"><span class="tinyavatar">${esc(initials(s))}</span>${esc(s||'Unassigned')}</span>`;const tag=(text,kind='')=>`<span class="tag ${kind}">${esc(text)}</span>`;
function shell(title,sub,button=''){return `<div class="page-title"><div><div class="eyebrow">${esc(title)}</div><h1>${esc(sub)}</h1></div>${button}</div>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.querySelector('#crumb').textContent=({overview:'Overview',meetings:'Meetings',memory:'Decision memory',actions:'Action items',digest:'Weekly digest',settings:'Settings'})[page];document.querySelector('#actionnav').textContent=db.pending.length?db.pending.length:'';let v=document.querySelector('#view');({overview:overview,meetings:meetings,memory:memory,actions:actions,digest:digest,settings:settings}[page])(v)}
function overview(v){const reviewed=db.actions.filter(x=>x.status==='Needs review').length;v.innerHTML=`<div class="hello"><div><div class="eyebrow">Saturday, October 31, 2026</div><h1>Good morning, Nina</h1><div class="sub">A clear view of what your meetings set in motion.</div></div><button class="button primary" onclick="openIngest()">＋ &nbsp;Add transcript</button></div><div class="metricgrid"><div class="metric"><div class="metric-top">Meetings captured <span class="metric-icon">◷</span></div><div class="metric-val">${db.meetings.length}</div><div class="metric-note">in your workspace</div></div><div class="metric"><div class="metric-top">Decisions remembered <span class="metric-icon">◉</span></div><div class="metric-val">${db.memory.length}</div><div class="metric-note">across all meetings</div></div><div class="metric"><div class="metric-top">Need your review <span style="color:#ce9142">◇</span></div><div class="metric-val">${db.pending.length+reviewed}</div><div class="metric-note">approve before they are shared</div></div><div class="metric"><div class="metric-top">Coming up <span class="metric-icon">↗</span></div><div class="metric-val">${db.actions.filter(a=>a.status==='Approved').length}</div><div class="metric-note">approved items with deadlines</div></div></div><div class="contentgrid"><section class="card"><div class="cardhead"><div><h2>Needs your attention</h2><p>Review before anything leaves Threadline</p></div><button class="button small" onclick="go('actions')">View all &nbsp;→</button></div><div class="list">${db.pending.length?db.pending.slice(0,1).map(p=>`<div class="item"><div class="item-top">${tag('CONFLICT DETECTED','conflict')}<span class="time">Just now</span></div><h3>${esc(p.text)}</h3><div class="meta">${person(p.owner)} <span>·</span> Due ${esc(p.due)}</div><div class="warn"><b>Conflicts with a previous commitment.</b><br>${esc(p.conflict)}</div><div class="row-actions"><button class="button small" onclick="reviewItem('${p.id}')">Review conflict</button><button class="button small" onclick="dismiss('${p.id}')">Dismiss</button></div></div>`).join(''):`<div class="empty">Nothing waiting for review.</div>`}${db.actions.filter(a=>a.status==='Needs review').slice(0,2).map(a=>`<div class="item"><div class="item-top">${tag('ACTION ITEM','action')}<span class="time">From ${esc(a.meeting)}</span></div><h3>${esc(a.text)}</h3><div class="meta">${person(a.owner)} <span>·</span> Due ${esc(a.due)}</div><div class="row-actions" style="margin-top:10px"><button class="button small primary" onclick="approve('${a.id}')">Approve & create task</button><button class="button small" onclick="editAction('${a.id}')">Edit</button></div></div>`).join('')}</div></section><div class="rightcol"><section class="card"><div class="cardhead"><div><h2>This week, at a glance</h2><p>Your team's execution snapshot</p></div><button class="button small" onclick="go('digest')">↗</button></div><div class="digest"><div class="digestdate">WEEK OF OCT 26</div><h3>Team weekly digest</h3><p>${db.actions.filter(a=>a.status==='Approved').length} commitments · ${db.memory.length} decisions · ${db.pending.length} item${db.pending.length===1?'':'s'} need a decision</p><div class="personrow"><span>${person('Leo Park')}</span><span class="count">2 items</span></div><div class="personrow"><span>${person('Maya Chen')}</span><span class="count">1 item</span></div><button class="button small" style="margin-top:10px" onclick="go('digest')">Open digest</button></div></section><section class="card"><div class="cardhead"><div><h2>Deadline reminders</h2><p>Coming up soon</p></div><span class="state">● On</span></div><div class="list">${db.actions.filter(a=>a.status==='Approved').slice(0,2).map(a=>`<div class="reminder"><div class="datebox"><div>NOV<br><b>${esc((a.due||'').split(' ')[1]?.replace(',','')||'12')}</b></div></div><div><strong>${esc(a.text)}</strong><small>${esc(a.owner)} · ${esc(a.due)}</small></div></div>`).join('')||'<div class="empty" style="padding:20px">Approve tasks to see reminders.</div>'}</div></section></div></div>`}
function meetings(v){v.innerHTML=shell('MEETING LIBRARY','Conversations that move work forward.',`<button class="button primary" onclick="openIngest()">＋ Add transcript</button>`)+`<div class="card"><div class="cardhead"><div><h2>All meetings</h2><p>Transcripts, decisions, and actions in one place</p></div></div><div class="list">${db.meetings.map(m=>`<div class="item"><div class="item-top"><span class="tag">TRANSCRIPT</span><span class="time">${esc(m.date)} · ${esc(m.duration||'')}</span></div><h3>${esc(m.title)}</h3><div class="meta">${(m.speakers||[]).map(person).join('')} &nbsp;·&nbsp; ${(m.decisions||0)} decisions · ${(m.actions||0)} action items</div><button class="button small" style="margin-top:11px" onclick="meetingDetails('${m.id}')">Open meeting</button></div>`).join('')||'<div class="empty">Add your first transcript to start building shared memory.</div>'}</div></div>`}
function memory(v){v.innerHTML=shell('CROSS-MEETING CONTEXT','Decisions your team can build on.')+`<div style="display:flex;gap:9px;margin-bottom:14px"><input id="memfilter" class="memsearch" placeholder="⌕  Search past decisions" oninput="filterMemory()"><button class="button" onclick="openIngest()">＋ Add meeting</button></div><div id="memtable" class="card">${memoryRows(db.memory)}</div>`}
function memoryRows(rows){return `<table class="table"><thead><tr><th>Decision</th><th>Owner / speaker</th><th>Meeting</th><th>Date</th></tr></thead><tbody>${rows.map(d=>`<tr><td>${tag(d.type||'Decision','memory')}<div style="margin-top:7px;font-weight:600">${esc(d.text)}</div></td><td>${person(d.speaker)}</td><td>${esc(d.meeting)}</td><td>${esc(d.date)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No decisions remembered yet.</td></tr>'}</tbody></table>`}
function filterMemory(){let q=document.querySelector('#memfilter').value.toLowerCase();document.querySelector('#memtable').innerHTML=memoryRows(db.memory.filter(d=>`${d.text} ${d.speaker} ${d.meeting}`.toLowerCase().includes(q)))}
function actions(v){let items=db.actions.map(a=>`<div class="item"><div class="item-top">${tag(a.status==='Needs review'?'ACTION ITEM · DRAFT':'APPROVED TASK',a.status==='Needs review'?'action':'')}${a.status==='Approved'?'<span class="state">● In task queue</span>':''}</div><h3>${esc(a.text)}</h3><div class="meta">${person(a.owner)} · Due ${esc(a.due)} · ${esc(a.meeting)}</div><div class="row-actions" style="margin-top:10px">${a.status==='Needs review'?`<button class="button small primary" onclick="approve('${a.id}')">Approve & create task</button><button class="button small" onclick="editAction('${a.id}')">Edit</button>`:tag('Reminder scheduled','memory')}</div></div>`).join('');let conflicts=db.pending.map(p=>`<div class="item"><div class="item-top">${tag('CONFLICT DETECTED','conflict')}<span class="time">${esc(p.meeting)}</span></div><h3>${esc(p.text)}</h3><div class="meta">${person(p.owner)} · Due ${esc(p.due)}</div><div class="warn"><b>Earlier decision:</b> ${esc(p.conflict)}</div><div class="row-actions"><button class="button small primary" onclick="reviewItem('${p.id}')">Resolve & review</button><button class="button small" onclick="dismiss('${p.id}')">Dismiss</button></div></div>`).join('');v.innerHTML=shell('ACTION QUEUE','Work moves when someone owns the next step.',`<button class="button" onclick="openIngest()">＋ From transcript</button>`)+`<div class="card"><div class="cardhead"><div><h2>Drafts and commitments</h2><p>Approval is required before creating a task.</p></div><div>${tag(db.actions.filter(x=>x.status==='Needs review').length+' to review','conflict')}</div></div><div class="list">${conflicts}${items}${(!items&&!conflicts)?'<div class="empty">No action items yet. Add a meeting transcript to get started.</div>':''}</div></div>`}
function digest(v){let approved=db.actions.filter(a=>a.status==='Approved'),people=[...new Set(approved.map(a=>a.owner))];v.innerHTML=shell('WEEKLY DIGEST','A personal view of who is doing what.')+`<div class="toolbar" style="margin-bottom:17px"><button class="button primary" onclick="toast('Digest preview is ready. Connect a delivery channel in Settings to schedule it.')">Preview this week’s digest</button><span class="footnote">Every Monday · Review before sharing</span></div><div class="contentgrid"><div class="card"><div class="cardhead"><div><h2>Week of October 26</h2><p>${approved.length} approved commitments across ${people.length} people</p></div>${tag('PRIVATE PREVIEW','memory')}</div><div class="list">${people.map((p,i)=>`<div class="item"><div class="item-top">${person(p)}<span class="count">${approved.filter(a=>a.owner===p).length} commitments</span></div><div style="padding-left:27px">${approved.filter(a=>a.owner===p).map(a=>`<div style="padding:10px 0;border-bottom:1px solid #f0f2f0;font-size:11px">${esc(a.text)}<div class="time" style="margin-top:6px">Due ${esc(a.due)}</div></div>`).join('')}</div></div>`).join('')||'<div class="empty">Approve a task to build a personal digest.</div>'}</div></div><div class="card"><div class="cardhead"><div><h2>Shared decisions</h2><p>Context from recent conversations</p></div></div><div class="list">${db.memory.slice(0,4).map(d=>`<div class="item"><div class="time">${esc(d.meeting)}</div><h3>${esc(d.text)}</h3><div class="meta">${person(d.speaker)}</div></div>`).join('')}</div><div class="bottomhint">Digest sharing always requires confirmation. Choose a delivery channel in Settings to configure weekly delivery.</div></div></div>`}
function settings(v){v.innerHTML=shell('WORKSPACE PREFERENCES','Make meeting follow-through feel effortless.')+`<div class="settingsgrid"><div><section class="card" style="margin-bottom:14px"><div class="cardhead"><div><h2>Task tracker</h2><p>Connect where your team plans and ships work</p></div></div><div class="integration"><div class="integration-logo">${db.integration==='Not connected'?'↗':'✓'}</div><div style="flex:1"><strong>${esc(db.integration==='Not connected'?'Choose a task tracker':db.integration)}</strong><small>${db.integration==='Not connected'?'Not connected · Review drafts without a tracker':'Connected · Approval required before posting'}</small></div><button class="button small" onclick="trackerModal()">${db.integration==='Not connected'?'Connect':'Manage'}</button></div><div class="bottomhint">Threadline will never send a task to your tracker until you approve it from the action queue.</div></section><section class="card"><div class="cardhead"><div><h2>Reminders</h2><p>Get a nudge before commitments come due</p></div></div><div class="list"><div class="item" style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:12px">Deadline reminders</b><div class="sub" style="font-size:10px;margin-top:5px">1 day before a task is due</div></div><input class="toggle" type="checkbox" ${db.reminders?'checked':''} onchange="db.reminders=this.checked;if(window.threadline)db.actions.filter(a=>a.status==='Approved').forEach(a=>window.threadline.scheduleReminder({...a,enabled:db.reminders}));save();render()"></div></div></section></div><div><section class="card" style="margin-bottom:14px"><div class="cardhead"><div><h2>Weekly digest</h2><p>A personal summary for each teammate</p></div></div><div class="list"><div class="item" style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:12px">Prepare every Monday</b><div class="sub" style="font-size:10px;margin-top:5px">Preview required before sharing</div></div><input class="toggle" type="checkbox" ${db.digest?'checked':''} onchange="db.digest=this.checked;save();render()"></div></div><div class="integration"><div class="integration-logo" style="background:#f6efe2;color:#af7a30">✉</div><div style="flex:1"><strong>Delivery channel</strong><small>Not configured · Digest stays private</small></div><button class="button small" onclick="toast('Email digest delivery is not configured in this prototype.')">Set up</button></div></section><section class="card"><div class="cardhead"><div><h2>Privacy & data</h2><p>Local-first by default</p></div></div><div class="list"><div class="item"><b style="font-size:12px">Your workspace data</b><p class="sub" style="font-size:10px;line-height:1.6;margin:6px 0 12px">Transcripts, decisions, and tasks live in local app storage on this device. This prototype does not upload them to a server.</p><button class="button small" onclick="exportData()">Export my data</button> <button class="button small" onclick="confirmClear()">Clear local data</button></div></div></section></div></div>`}
function go(p){page=p;render()}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function toast(msg){let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),2600)}function modal(html){document.querySelector('#layer').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="modal">${html}</section></div>`}function closeModal(){document.querySelector('#layer').innerHTML=''}
function openIngest(){modal(`<h2>Bring a meeting into memory</h2><div class="muted">Paste a transcript to find decisions, owners, deadlines, and possible conflicts with past commitments.</div><label class="field">MEETING TITLE</label><input class="input" id="mtitle" placeholder="e.g. Product & Engineering Weekly"><label class="field">TRANSCRIPT</label><textarea class="textarea" id="transcript" placeholder="Maya Chen: We agreed to ship the release by Friday.\nLeo Park: I’ll finish QA by Thursday."></textarea><div class="transcript">◉ Speaker attribution is read from “Name: words…” lines.</div><div class="drop">Transcript files are planned · paste transcript text to begin</div><div class="modalfoot"><span class="footnote">Nothing is sent anywhere during analysis.</span><div class="footright"><button class="button" onclick="closeModal()">Cancel</button><button class="button primary" onclick="analyze()">Find decisions & actions →</button></div></div>`)}
function parseDue(s){let m=s.match(/\b(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2})\b/i);return m?`${m[1].slice(0,3)} ${m[2]}, 2026`:''}
function analyze(){let title=document.querySelector('#mtitle').value.trim()||'Untitled meeting',raw=document.querySelector('#transcript').value.trim();if(!raw){toast('Paste a transcript first.');return}let lines=raw.split(/\n+/).map(s=>s.trim()).filter(Boolean),records=[];for(const line of lines){let m=line.match(/^([^:]{2,50}):\s*(.+)$/);if(!m)continue;let speaker=m[1].trim(),text=m[2].trim(),decision=/\b(agreed|decided|decision|will keep|stays|commit to|committed to|remain|launch by|deadline is)\b/i.test(text),action=/\b(I will|I’ll|I can|I own|I am going to|I’m going to|will (?:draft|finish|complete|send|share|prepare|build|deliver|review|update|create|follow up))\b/i.test(text);if(!decision&&!action)continue;let item={speaker,text,due:parseDue(text)};if(action){let clean=text.replace(/^(I will|I’ll|I can|I own|I am going to|I’m going to)\s*/i,'').replace(/\b(?:and )?(?:share|send|deliver|finish|complete) (?:it|this|the .*?) (?:with .*? )?by\s+\w+\s+\d{1,2}\.?/i,'').replace(/\s+by\s+\w+\s+\d{1,2}\.?$/i,'').replace(/[.!?]$/,'');records.push({kind:'action',...item,task:clean?clean[0].toUpperCase()+clean.slice(1):text})}if(decision)records.push({kind:'decision',...item})}if(!records.length){records.push({kind:'action',speaker:'Unassigned',text:raw.split('\n')[0],task:raw.split('\n')[0],due:''})}let conflicts=[];for(const r of records.filter(x=>x.kind==='decision'))for(const old of db.memory){let words=r.text.toLowerCase().split(/\W+/).filter(w=>w.length>4&&!['until','after','before','agreed','decision','should','would','could'].includes(w));let oldWords=old.text.toLowerCase().split(/\W+/);let overlap=words.filter(w=>oldWords.includes(w)).length;let opposed=(/\b(public|open)\b/i.test(r.text)&&/\binvite.only|private|closed\b/i.test(old.text)||/\binvite.only|private|closed\b/i.test(r.text)&&/\bpublic|open\b/i.test(old.text)||/\b(push|move|delay|postpone)\b/i.test(r.text)&&/\b(before|by|deadline|scheduled)\b/i.test(old.text)&&words.some(w=>oldWords.includes(w)));if(opposed||overlap>=2){conflicts.push({text:r.text,speaker:r.speaker,previous:old.text,meeting:old.meeting,date:old.date})}}let id='m'+Date.now(),meeting={id,title,date:'Oct 29, 2026',duration:'Transcript',speakers:[...new Set(records.map(r=>r.speaker))],decisions:records.filter(r=>r.kind==='decision').length,actions:records.filter(r=>r.kind==='action').length};db.meetings.unshift(meeting);records.filter(x=>x.kind==='decision').forEach(r=>{let conflict=conflicts.find(c=>c.text===r.text);if(!conflict)db.memory.unshift({id:'d'+Date.now()+Math.random(),text:r.text,speaker:r.speaker,meeting:title,date:meeting.date,type:'Decision'})});records.filter(x=>x.kind==='action').forEach(r=>db.actions.unshift({id:'a'+Date.now()+Math.random(),text:r.task,owner:r.speaker,due:r.due||'No deadline set',meeting:title,status:'Needs review'}));conflicts.forEach(c=>db.pending.unshift({id:'p'+Date.now()+Math.random(),text:c.text,owner:c.speaker,due:'No deadline set',meeting:title,conflict:`“${c.previous}” (${c.meeting}, ${c.date})`}));save();closeModal();page='actions';render();toast(`${records.length} candidate items found · review before approval`)}
async function approve(id){let a=db.actions.find(x=>x.id===id);if(!a)return;if(trackerEndpoint){try{await window.threadline.postApprovedTask(a)}catch(e){toast('Task was not posted: '+e.message);return}}a.status='Approved';db.reviewed++;if(db.reminders&&window.threadline)window.threadline.scheduleReminder(a);save();render();toast(trackerEndpoint?'Approved and posted to your tracker.':'Approved and added to your local task queue. Connect a webhook in Settings to post tasks.')}
function editAction(id){let a=db.actions.find(x=>x.id===id);modal(`<h2>Review action item</h2><div class="muted">Edit the extracted task, assignee, or due date before approval.</div><label class="field">TASK</label><input class="input" id="edittext" value="${esc(a.text)}"><label class="field">OWNER</label><input class="input" id="editowner" value="${esc(a.owner)}"><label class="field">DEADLINE</label><input class="input" id="editdue" value="${esc(a.due)}"><div class="modalfoot"><button class="button" onclick="closeModal()">Cancel</button><div class="footright"><button class="button primary" onclick="saveAction('${id}')">Save changes</button></div></div>`)}function saveAction(id){let a=db.actions.find(x=>x.id===id);a.text=document.querySelector('#edittext').value;a.owner=document.querySelector('#editowner').value;a.due=document.querySelector('#editdue').value;save();closeModal();render();toast('Draft updated.')}
function reviewItem(id){let p=db.pending.find(x=>x.id===id);modal(`<h2>Review a possible conflict</h2><div class="muted">Threadline found a decision that may conflict with earlier meeting memory. Decide what should be remembered.</div><div class="conflict-card"><b>New statement · ${esc(p.meeting)}</b><p>${esc(p.text)}</p></div><div class="conflict-card" style="background:#f7f7fb;border-color:#e5e1f0"><b>Earlier decision · from memory</b><p>${esc(p.conflict)}</p></div><label class="field">RESOLUTION</label><select id="resolution" class="select"><option value="new">Replace old memory with this decision</option><option value="keep">Keep earlier decision; treat this as a proposal</option><option value="both">Keep both and mark for follow-up</option></select><div class="modalfoot"><button class="button" onclick="closeModal()">Cancel</button><div class="footright"><button class="button primary" onclick="resolve('${id}')">Save resolution</button></div></div>`)}function resolve(id){let p=db.pending.find(x=>x.id===id),how=document.querySelector('#resolution').value;if(how==='new'){db.memory=db.memory.filter(d=>!p.conflict.includes(d.text));db.memory.unshift({id:'d'+Date.now(),text:p.text,speaker:p.owner,meeting:p.meeting,date:'Oct 29, 2026',type:'Decision'})}if(how==='both')db.memory.unshift({id:'d'+Date.now(),text:p.text+' (follow up)',speaker:p.owner,meeting:p.meeting,date:'Oct 29, 2026',type:'Follow-up'});db.pending=db.pending.filter(x=>x.id!==id);save();closeModal();render();toast('Conflict resolution saved to shared memory.')}
function dismiss(id){db.pending=db.pending.filter(p=>p.id!==id);save();render();toast('Dismissed. No task was created.')}
function trackerModal(){modal(`<h2>Connect a task tracker</h2><div class="muted">Use an HTTPS webhook URL from your tracker or automation service. Threadline sends tasks only after you approve them.</div><label class="field">TASK CREATION WEBHOOK</label><input id="tracker-url" class="input" type="url" placeholder="https://your-service.example/tasks" value="${esc(trackerEndpoint)}"><div class="bottomhint">The endpoint is stored in the desktop app’s protected local storage. Approved tasks are sent as JSON with title, assignee, due date, and source meeting.</div><div class="modalfoot"><button class="button" onclick="closeModal()">Cancel</button><div class="footright"><button class="button" onclick="saveTracker('')">Disconnect</button><button class="button primary" onclick="saveTracker(document.querySelector('#tracker-url').value)">Save connection</button></div></div>`)}
async function saveTracker(url){try{await window.threadline.setTrackerEndpoint(url);trackerEndpoint=url.trim();db.integration=trackerEndpoint?'Webhook connected':'Not connected';save();closeModal();render();toast(trackerEndpoint?'Tracker webhook saved.':'Tracker disconnected.')}catch(e){toast(e.message)}}
function meetingDetails(id){let m=db.meetings.find(x=>x.id===id);modal(`<h2>${esc(m.title)}</h2><div class="muted">${esc(m.date)} · ${m.speakers.map(esc).join(', ')}</div><div class="divider">Decisions</div>${db.memory.filter(x=>x.meeting===m.title).map(d=>`<div class="item">${tag('DECISION','memory')}<h3>${esc(d.text)}</h3><div class="meta">${person(d.speaker)}</div></div>`).join('')||'<p class="footnote">No final decisions recorded for this meeting.</p>'}<div class="divider">Action items</div>${db.actions.filter(x=>x.meeting===m.title).map(a=>`<div class="item">${tag(a.status.toUpperCase(),a.status==='Needs review'?'action':'')}<h3>${esc(a.text)}</h3><div class="meta">${person(a.owner)} · ${esc(a.due)}</div></div>`).join('')||'<p class="footnote">No action items recorded.</p>'}<div class="modalfoot"><span></span><button class="button" onclick="closeModal()">Close</button></div>`)}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='threadline-export.json';a.click();URL.revokeObjectURL(a.href);toast('Your workspace data was exported.')};function confirmClear(){modal(`<h2>Clear local workspace?</h2><div class="muted">This permanently removes transcripts, decision memory, and action items stored on this device.</div><div class="modalfoot"><button class="button" onclick="closeModal()">Cancel</button><button class="button" style="color:#ad4b3c" onclick="localStorage.removeItem('threadline-db');location.reload()">Clear all data</button></div>`)}
render();if(window.threadline){window.threadline.getTrackerEndpoint().then(url=>{trackerEndpoint=url||'';if(trackerEndpoint)db.integration='Webhook connected';render()}).catch(()=>{});if(db.reminders)db.actions.filter(a=>a.status==='Approved').forEach(a=>window.threadline.scheduleReminder(a))}
</script></body></html>
